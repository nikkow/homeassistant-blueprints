blueprint:
  name: Éclairage extérieur sur détection de personne (sonnette)
  description: >
    Allume une lumière extérieure quand la sonnette détecte une personne qui
    reste dans son champ — et non un simple passant dans la rue — puis
    l'éteint après une période sans mouvement.

    Une lumière déjà allumée à la main n'est ni reprise ni éteinte. Une
    lumière dont la luminosité ou la couleur a été modifiée pendant le cycle
    (variateur, application, scène) n'est plus touchée. Une durée d'allumage
    maximale, facultative, éteint la lumière dans tous les cas.

    À instancier une fois par entrée (porte, portail…).
  domain: automation
  input:
    capteurs_personne:
      name: Capteurs de détection de personne
      description: >
        Capteur(s) « personne » de la sonnette, de préférence restreint(s) à
        une zone de détection devant la porte dans l'application du fabricant.
        Un capteur de mouvement simple fonctionne aussi, mais filtre moins bien
        les passants.
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
    duree_presence:
      name: Durée de présence minimale
      description: >
        Temps pendant lequel une personne doit rester détectée avant
        l'allumage. Filtre les passants qui ne font que traverser le champ, à
        condition de dépasser la durée d'activité minimale du capteur (5 s
        sur une sonnette Aqara : y mettre 8 s). Mettre 0 pour allumer dès la
        détection.
      default:
        hours: 0
        minutes: 0
        seconds: 3
      selector:
        duration:
    capteurs_maintien:
      name: Capteurs de maintien
      description: >
        Optionnel. Capteurs dont le mouvement prolonge l'éclairage une fois
        allumé (mouvement de la sonnette, détecteur extérieur…). Laisser vide
        pour utiliser les capteurs de détection de personne.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
    capteurs_confirmation:
      name: Capteurs de confirmation
      description: >
        Optionnel. Si renseignés, l'allumage exige qu'au moins l'un d'eux soit
        aussi à « on » (détecteur PIR sur le perron, capteur « personne »
        distinct, contact de portail…). Filtre les passants et les fausses
        détections de la caméra (phares, pluie, insectes en vision nocturne).
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
    lumieres:
      name: Lumières
      description: Lumières extérieures à piloter.
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
    delai_extinction:
      name: Délai avant extinction
      description: Temps sans mouvement avant d'éteindre.
      default:
        hours: 0
        minutes: 3
        seconds: 0
      selector:
        duration:
    elevation_max:
      name: Élévation solaire maximale
      description: >
        L'allumage n'a lieu que si le soleil est sous cette élévation. 0° =
        coucher du soleil ; -6° = fin du crépuscule civil. Mettre 90 pour
        allumer à toute heure.
      default: 0
      selector:
        number:
          min: -18
          max: 90
          step: 1
          unit_of_measurement: "°"
          mode: box
    luminosite:
      name: Luminosité
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider
    kelvin:
      name: Température de couleur
      description: >
        Mettre à 0 pour ne pas envoyer de température de couleur — nécessaire
        pour les lumières non réglables en blanc.
      default: 2700
      selector:
        number:
          min: 0
          max: 6500
          step: 100
          unit_of_measurement: K
          mode: box
    transition:
      name: Durée de transition
      description: Fondu à l'allumage et à l'extinction.
      default: 1
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: s
          mode: box
    delai_garde:
      name: Délai de garde après extinction
      description: >
        Une détection qui commence dans ce délai après l'extinction de la
        lumière (ou pendant le fondu) est ignorée. La caméra de la sonnette
        prend le changement brusque d'éclairage (et le passage en vision
        nocturne infrarouge) pour un mouvement, ce qui rallumerait la lumière
        en boucle. Doit dépasser l'écart entre l'extinction et cette fausse
        détection (jusqu'à 53 s mesurées sur une sonnette Aqara).
      default: 90
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: s
          mode: box
    duree_max:
      name: Durée d'allumage maximale
      description: >
        Filet de sécurité. Une lumière restée allumée sans interruption pendant
        cette durée est éteinte, quelle qu'en soit la raison — y compris une
        lumière allumée à la main. Couvre les cycles interrompus (redémarrage,
        rechargement, erreur), qui laisseraient sinon la lumière allumée
        indéfiniment. 0 = désactivé.
      default:
        hours: 0
        minutes: 0
        seconds: 0
      selector:
        duration:
    entites_blocage:
      name: Entités de blocage
      description: >
        Optionnel. Tant que l'une de ces entités est à « on », l'automatisation
        ne fait rien (fête, vacances…).
      default: []
      selector:
        entity:
          multiple: true

mode: restart
max_exceeded: silent

variables:
  capteurs_personne: !input capteurs_personne
  capteurs_maintien: !input capteurs_maintien
  capteurs_confirmation: !input capteurs_confirmation
  lumieres: !input lumieres
  elevation_max: !input elevation_max
  luminosite: !input luminosite
  kelvin: !input kelvin
  transition: !input transition
  delai_garde: !input delai_garde
  entites_blocage: !input entites_blocage
  duree_max: !input duree_max
  duree_max_s: >-
    {{ duree_max.hours | default(0) | int(0) * 3600
       + duree_max.minutes | default(0) | int(0) * 60
       + duree_max.seconds | default(0) | int(0) }}
  capteurs_maintien_effectifs: >-
    {{ capteurs_maintien if capteurs_maintien | count > 0
       else capteurs_personne }}
  # `this` est figé au déclenchement : en mode restart, le cycle précédent est
  # encore compté dans `current` à cet instant.
  cycle_en_cours: "{{ this.attributes.current | default(0) | int(0) > 0 }}"
  # Luminosité attendue sur l'échelle 0-255 de l'attribut `brightness`.
  brightness_cible: "{{ (luminosite | int * 255 / 100) | round(0) | int }}"
  parametres: >-
    {% set base = {'transition': transition | int(0),
                   'brightness_pct': luminosite | int} %}
    {{ dict(base, color_temp_kelvin=kelvin | int)
       if kelvin | int > 0 else base }}

triggers:
  # Seul un vrai passage off → on compte : un capteur qui revient de
  # « indisponible » (reconnexion de la sonnette, redémarrage de Home
  # Assistant) directement à « on » n'est pas une détection.
  - trigger: state
    id: detection
    entity_id: !input capteurs_personne
    from: "off"
    to: "on"
    for: !input duree_presence
  # Filet de sécurité : lumière allumée depuis trop longtemps. Avec une durée
  # de 0, il se déclenche à chaque allumage et la première condition l'écarte
  # (les conditions sont évaluées avant que `restart` n'arrête le cycle).
  - trigger: state
    id: securite
    entity_id: !input lumieres
    to: "on"
    for: !input duree_max

conditions:
  - condition: template
    value_template: "{{ trigger.id != 'securite' or duree_max_s | int(0) > 0 }}"
  - condition: or
    conditions:
      - condition: trigger
        id: securite
      - condition: and
        conditions:
          - condition: template
            value_template: >-
              {{ expand(entites_blocage) | selectattr('state', 'eq', 'on')
                 | list | count == 0 }}
          # Condition de nuit ignorée pendant un cycle : une détection à l'aube doit
          # prolonger l'éclairage, pas le laisser allumé sans extinction.
          - condition: template
            value_template: >-
              {{ cycle_en_cours
                 or state_attr('sun.sun', 'elevation') | float(-90)
                    < elevation_max | float }}
          # Lumière allumée hors cycle = allumage manuel : on n'y touche pas.
          - condition: template
            value_template: >-
              {{ cycle_en_cours
                 or expand(lumieres) | selectattr('state', 'eq', 'on')
                    | list | count == 0 }}
          - condition: template
            value_template: >-
              {{ capteurs_confirmation | count == 0
                 or expand(capteurs_confirmation) | selectattr('state', 'eq', 'on')
                    | list | count > 0 }}
          # Faux mouvement provoqué par l'extinction elle-même : la détection a
          # commencé (`last_changed` du capteur, avant la durée `for`) dans le délai de
          # garde qui suit le passage à « off » d'une lumière. La marge avant couvre le
          # fondu, pendant lequel l'ordre des deux changements d'état n'est pas garanti.
          - condition: template
            value_template: >-
              {% set debut = trigger.to_state.last_changed %}
              {{ expand(lumieres) | selectattr('state', 'eq', 'off')
                 | selectattr('last_changed', '>=', debut
                              - timedelta(seconds=delai_garde | int(0)))
                 | selectattr('last_changed', '<=', debut
                              + timedelta(seconds=transition | int(0) + 2))
                 | list | count == 0 }}

actions:
  - if:
      - condition: trigger
        id: securite
    then:
      - action: light.turn_off
        target:
          entity_id: "{{ trigger.entity_id }}"
        data:
          transition: "{{ transition | int(0) }}"
      - stop: Durée d'allumage maximale atteinte

  # Une lumière allumée est « à nous » tant qu'elle porte encore la luminosité
  # et la température appliquées par l'automatisation (tolérances : arrondis
  # des ampoules ; attribut absent = non vérifiable, donc accepté — `.get()`
  # obligatoire, l'accès direct à un attribut absent fait échouer l'exécution). Toute autre lumière allumée a été réglée à la main pendant
  # le cycle : une nouvelle détection ne l'écrase pas, l'extinction l'épargne.
  # Même règle dans `lumieres_a_eteindre` plus bas.
  - variables:
      lumieres_a_allumer: >-
        {% set ns = namespace(l=[]) %}
        {% for e in expand(lumieres) %}
          {% set b = e.attributes.get('brightness') %}
          {% set k = e.attributes.get('color_temp_kelvin') %}
          {% if e.state != 'on'
                or ((b is none or (b | int - brightness_cible) | abs <= 3)
                    and (kelvin | int == 0 or k is none
                         or (k | int - kelvin | int) | abs <= 100)) %}
            {% set ns.l = ns.l + [e.entity_id] %}
          {% endif %}
        {% endfor %}
        {{ ns.l }}
  - if:
      - condition: template
        value_template: "{{ lumieres_a_allumer | count > 0 }}"
    then:
      - action: light.turn_on
        target:
          entity_id: "{{ lumieres_a_allumer }}"
        data: "{{ parametres }}"

  # Attendre que tout soit calme, puis décompter. Un mouvement pendant le
  # décompte le relance ; une nouvelle personne relance tout le cycle.
  # Pour un capteur qui reste actif après le mouvement, l'extinction a donc
  # lieu « délai + durée de maintien du capteur » après le dernier mouvement.
  - repeat:
      sequence:
        - wait_template: >-
            {{ expand(capteurs_maintien_effectifs) | selectattr('state', 'eq', 'on')
               | list | count == 0 }}
        - wait_template: >-
            {{ expand(capteurs_maintien_effectifs) | selectattr('state', 'eq', 'on')
               | list | count > 0 }}
          timeout: !input delai_extinction
          continue_on_timeout: true
      until: "{{ not wait.completed }}"

  - variables:
      lumieres_a_eteindre: >-
        {% set ns = namespace(l=[]) %}
        {% for e in expand(lumieres) | selectattr('state', 'eq', 'on') %}
          {% set b = e.attributes.get('brightness') %}
          {% set k = e.attributes.get('color_temp_kelvin') %}
          {% if (b is none or (b | int - brightness_cible) | abs <= 3)
                and (kelvin | int == 0 or k is none
                     or (k | int - kelvin | int) | abs <= 100) %}
            {% set ns.l = ns.l + [e.entity_id] %}
          {% endif %}
        {% endfor %}
        {{ ns.l }}
  - if:
      - condition: template
        value_template: "{{ lumieres_a_eteindre | count > 0 }}"
    then:
      - action: light.turn_off
        target:
          entity_id: "{{ lumieres_a_eteindre }}"
        data:
          transition: "{{ transition | int(0) }}"
