---
name: Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validation:
    name: YAML et blueprints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: pip install --disable-pip-version-check pyyaml yamllint

      - name: Formatage YAML
        run: yamllint -c .yamllint.yml --strict .

      - name: Structure des blueprints
        run: python scripts/validate_blueprints.py
